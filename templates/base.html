{% load static %}
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GekkoTeca</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="home-body">

    <div class="mobile-simulator">
        
        <div id="loading-screen" class="loading-overlay">
            <div class="loading-wrapper">
                <img src="{% static 'IMG/logo.png' %}" alt="Gekkoteca Loading" class="loading-gecko-spin">
                <p class="loading-text">Carregando...</p>
            </div>
        </div>

        <div class="mobile-content">
            {% block content %}
            {% endblock %}
        </div>

        <nav class="bottom-nav">
            <a href="{% url 'home' %}" class="nav-item">
                <img src="{% static 'IMG/menu.png' %}" alt="Início" width="24" height="24"> Início
            </a>
            <a href="{% url 'acervo_view' %}" class="nav-item">
                <img src="{% static 'IMG/acervo.png' %}" alt="Meu Acervo" width="24" height="24"> Meu Acerto
            </a>
            <a href="{% url 'carrinho_view' %}" class="nav-item">
                <img src="{% static 'IMG/carrinho.png' %}" alt="Carrinho" width="24" height="24"> Carrinho
            </a>
            <a href="#" class="nav-item">
                <img src="{% static 'IMG/delivery.png' %}" alt="Pedidos" width="30" height="30"> Pedidos
            </a>
            <a href="{% url 'perfil_view' %}" class="nav-item">
                <img src="{% static 'IMG/profile.png' %}" alt="Perfil" width="24" height="24"> Perfil
            </a>
        </nav>

    </div> 
    
    <script src="{% static 'js/script.js' %}"></script>
    <script>
        window.addEventListener('load', function() {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                setTimeout(function() {
                    loadingScreen.classList.add('hidden');
                }, 600); 
            }
        });

        // Acende o menu baseado na URL atual
        const currentUrl = window.location.pathname;
        const navLinks = document.querySelectorAll('.bottom-nav .nav-item');
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentUrl) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
    </script>
</body>
</html>
