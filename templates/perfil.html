<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gekkoteca - Perfil</title>
    <!-- Importação de ícones (Font Awesome) para os menus e navegação -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #7cb342; /* Verde do card de endereço */
            --light-lime: #d4f597;    /* Verde limão da barra inferior */
            --text-dark: #1a1a1a;
            --text-muted: #555555;
            --bg-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-white);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* Container simulando a tela do dispositivo móvel */
        .app-container {
            width: 100%;
            max-width: 412px; /* Tamanho padrão mobile */
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px; /* Espaço para a barra inferior não cobrir o conteúdo */
            display: flex;
            flex-direction: column;
        }

        /* 1. CABEÇALHO DO USUÁRIO */
        .profile-header {
            display: flex;
            align-items: center;
            padding: 24px 20px;
            gap: 16px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ccc;
        }

        .user-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* 2. CARD DE ENDEREÇO (Melhorado o contraste e padding) */
        .address-section {
            padding: 0 20px 20px 20px;
        }

        .address-card {
            background-color: var(--primary-green);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: #000000; /* Texto preto para garantir contraste no fundo verde */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .address-card i {
            font-size: 2rem;
        }

        .address-info h2 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .address-info p {
            font-size: 0.75rem;
            font-weight: 500;
            line-height: 1.3;
        }

        /* 3. MENU DE OPÇÕES (Alvos de toque expandidos para evitar misclicks) */
        .profile-menu {
            display: flex;
            flex-direction: column;
            padding: 10px 20px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 18px;
            text-decoration: none;
            color: var(--text-dark);
            /* IHC: Altura mínima de 56px garante clique fácil sem erros */
            min-height: 56px; 
            padding: 12px 8px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .menu-item:hover, .menu-item:focus {
            background-color: #f5f5f5;
            outline: none;
        }

        .menu-item i {
            font-size: 1.35rem;
            width: 24px;
            text-align: center;
            color: var(--text-dark);
        }

        .menu-item span {
            font-size: 1rem;
            font-weight: 500;
        }

        /* 4. BARRA DE NAVEGAÇÃO INFERIOR */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 412px;
            background-color: var(--light-lime);
            display: grid;
            grid-template-columns: repeat(5, 100fr);
            height: 70px;
            border-top: 1px solid rgba(0,0,0,0.1);
            z-index: 100;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .nav-tab i {
            font-size: 1.25rem;
        }

        /* Estado Ativo: Perfil destacado */
        .nav-tab.active {
            color: var(--text-dark);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Cabeçalho com dados do Usuário -->
        <header class="profile-header">
            <!-- Substitua o src pela URL da foto de perfil real se necessário -->
            <img src="https://via.placeholder.com/150" alt="Foto de perfil de João Herique" class="avatar">
            <h1 class="user-name">João Herique Guedes Alcoforado</h1>
        </header>

        <main>
            <!-- Bloco de Endereço de Entrega -->
            <section class="address-section">
                <div class="address-card">
                    <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                    <div class="address-info">
                        <h2>ENDEREÇO DE ENTREGA</h2>
                        <p>Rua do Molestamento - Imbiribeira, Recife - PE</p>
                    </div>
                </div>
            </section>

            <!-- Lista de Navegação Interna do Perfil -->
            <nav class="profile-menu" aria-label="Menu do perfil">
                <a href="#notificacoes" class="menu-item">
                    <i class="fa-regular fa-bell" aria-hidden="true"></i>
                    <span>Notificações</span>
                </a>
                <a href="#configuracoes" class="menu-item">
                    <i class="fa-solid fa-gear" aria-hidden="true"></i>
                    <span>Configurações</span>
                </a>
                <a href="#dados-pessoais" class="menu-item">
                    <i class="fa-regular fa-id-card" aria-hidden="true"></i>
                    <span>Dados pessoais</span>
                </a>
                <a href="#pagamentos" class="menu-item">
                    <i class="fa-regular fa-credit-card" aria-hidden="true"></i>
                    <span>Pagamentos</span>
                </a>
                <a href="#suporte" class="menu-item">
                    <i class="fa-solid fa-headset" aria-hidden="true"></i>
                    <span>Suporte</span>
                </a>
            </nav>
        </main>

        <!-- Barra de Navegação Inferior Global -->
        <nav class="bottom-nav" aria-label="Navegação principal">
            <a href="#inicio" class="nav-tab">
                <i class="fa-solid fa-house" aria-hidden="true"></i>
                Início
            </a>
            <a href="#acervo" class="nav-tab">
                <i class="fa-solid fa-book-bookmark" aria-hidden="true"></i>
                Meu Acervo
            </a>
            <a href="#carrinho" class="nav-tab">
                <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
                Carrinho
            </a>
            <a href="#pedidos" class="nav-tab">
                <i class="fa-solid fa-truck" aria-hidden="true"></i>
                Pedidos
            </a>
            <!-- Aba Perfil marcada como ativa conforme a imagem -->
            <a href="#perfil" class="nav-tab active" aria-current="page">
                <i class="fa-solid fa-user" aria-hidden="true"></i>
                Perfil
            </a>
        </nav>

    </div>

</body>
</html>
