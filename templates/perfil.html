{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gekkoteca - Perfil</title>
    <!-- Importação do Font Awesome para os ícones do menu lateral do perfil -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #81c784; /* Tom de verde mais próximo ao da imagem image_95506d.png */
            --light-lime: #d4f597;    /* Verde limão de fundo da barra inferior */
            --text-dark: #1a1a1a;
            --text-muted: #555555;
            --bg-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-white);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* Container simulando a tela do dispositivo móvel */
        .app-container {
            width: 100%;
            max-width: 412px; /* Proporção exata mobile */
            min-height: 100vh;
            position: relative;
            padding-bottom: 90px; /* Margem de segurança para a barra de navegação */
            display: flex;
            flex-direction: column;
            border: 1px solid #e0e0e0; /* Delimitação sutil da tela */
        }

        /* 1. CABEÇALHO DO USUÁRIO */
        .profile-header {
            display: flex;
            align-items: center;
            padding: 24px 20px;
            gap: 16px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* 2. CARD DE ENDEREÇO */
        .address-section {
            padding: 0 20px 20px 20px;
        }

        .address-card {
            background-color: #8cc63f; /* Verde idêntico ao da imagem */
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: #000000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .address-card i {
            font-size: 2.2rem;
        }

        .address-info h2 {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .address-info p {
            font-size: 0.72rem;
            font-weight: 500;
            line-height: 1.4;
        }

        /* 3. MENU DE OPÇÕES (Alvos expandidos para mitigar misclicks em IHC) */
        .profile-menu {
            display: flex;
            flex-direction: column;
            padding: 10px 20px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 18px;
            text-decoration: none;
            color: var(--text-dark);
            min-height: 56px; /* Garante área de toque WCAG para evitar cliques errados */
            padding: 12px 8px;
            border-radius: 8px;
            transition: background-color 0.15s ease;
        }

        .menu-item:hover, .menu-item:focus {
            background-color: #f7f7f7;
            outline: none;
        }

        .menu-item i {
            font-size: 1.4rem;
            width: 28px;
            text-align: center;
            color: #1a1a1a;
        }

        .menu-item span {
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* 4. BARRA DE NAVEGAÇÃO INFERIOR GLOBAL */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 412px;
            background-color: #d6f68d; /* Cor exata da imagem image_95506d.png */
            display: grid;
            grid-template-columns: repeat(5, 100fr);
            height: 75px;
            border-top: 1px solid rgba(0,0,0,0.05);
            z-index: 100;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #5d7a2b; /* Texto ligeiramente escurecido para contraste */
            gap: 4px;
            font-size: 0.72rem;
            font-weight: 500;
        }

        .nav-tab img {
            display: block;
            opacity: 0.7; /* Abas inativas ficam mais suaves */
            transition: transform 0.2s;
        }

        /* Estado Ativo: Apenas a aba Perfil ganha destaque visual completo */
        .nav-tab.active {
            color: #000000;
            font-weight: 700;
        }

        .nav-tab.active img {
            opacity: 1;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Cabeçalho alimentado dinamicamente pelo contexto Django -->
        <header class="profile-header">
            <img src="{{ foto_perfil_url }}" alt="Foto de perfil de {{ nome_completo }}" class="avatar">
            <h1 class="user-name">{{ nome_completo }}</h1>
        </header>

        <main>
            <!-- Bloco do Endereço de Entrega Dinâmico -->
            <section class="address-section">
                <div class="address-card">
                    <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                    <div class="address-info">
                        <h2>ENDEREÇO DE ENTREGA</h2>
                        <p>{{ endereco_entrega }}</p>
                    </div>
                </div>
            </section>

            <!-- Menu Interno utilizando Ícones do Font Awesome correspondentes à imagem -->
            <nav class="profile-menu" aria-label="Menu do perfil">
                <a href="#notificacoes" class="menu-item">
                    <i class="fa-regular fa-bell" aria-hidden="true"></i>
                    <span>Notificações</span>
                </a>
                <a href="#configuracoes" class="menu-item">
                    <i class="fa-solid fa-gear" aria-hidden="true"></i>
                    <span>Configurações</span>
                </a>
                <a href="#dados-pessoais" class="menu-item">
                    <i class="fa-regular fa-id-card" aria-hidden="true"></i>
                    <span>Dados pessoais</span>
                </a>
                <a href="#pagamentos" class="menu-item">
                    <i class="fa-regular fa-credit-card" aria-hidden="true"></i>
                    <span>Pagamentos</span>
                </a>
                <a href="#suporte" class="menu-item">
                    <i class="fa-solid fa-headset" aria-hidden="true"></i>
                    <span>Suporte</span>
                </a>
            </nav>
        </main>

        <!-- Barra de Navegação Inferior corrigida com a classe .nav-tab -->
        <nav class="bottom-nav" aria-label="Navegação principal">
            <a href="{% url 'home' %}" class="nav-tab">
                <img src="{% static 'IMG/menu.png' %}" alt="" width="24" height="24">
                Início
            </a>
            <a href="{% url 'acervo_view' %}" class="nav-tab">
                <img src="{% static 'IMG/acervo.png' %}" alt="" width="24" height="24">
                Meu Acervo
            </a>
            <a href="{% url 'carrinho_view' %}" class="nav-tab">
                <img src="{% static 'IMG/carrinho.png' %}" alt="" width="24" height="24">
                Carrinho
            </a>
            <a href="#" class="nav-tab">
                <img src="{% static 'IMG/delivery.png' %}" alt="" width="28" height="28">
                Pedidos
            </a>
            <!-- Somente a aba Perfil marcada como ativa nesta tela -->
            <a href="{% url 'perfil_view' %}" class="nav-tab active" aria-current="page">
                <img src="{% static 'IMG/profile.png' %}" alt="" width="24" height="24">
                Perfil
            </a>
        </nav>

    </div> 
    
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
