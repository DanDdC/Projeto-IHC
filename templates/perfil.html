{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    :root {
        --primary-green: #81c784; 
        --light-lime: #d4f597;    
        --text-dark: #1a1a1a;
        --text-muted: #555555;
        --bg-white: #ffffff;
    }

    /* 1. CABEÇALHO DO USUÁRIO */
    .profile-header {
        display: flex;
        align-items: center;
        padding: 24px 20px;
        gap: 16px;
    }

    .avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
    }

    .user-name {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text-dark);
    }

    /* 2. CARD DE ENDEREÇO */
    .address-section {
        padding: 0 20px 20px 20px;
    }

    .address-card {
        background-color: #8cc63f; 
        border-radius: 16px;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        color: #000000;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .address-card i {
        font-size: 2.2rem;
    }

    .address-info h2 {
        font-size: 0.9rem;
        font-weight: 700;
        margin-bottom: 2px;
        letter-spacing: 0.5px;
    }

    .address-info p {
        font-size: 0.72rem;
        font-weight: 500;
        line-height: 1.4;
    }

    /* 3. MENU DE OPÇÕES */
    .profile-menu {
        display: flex;
        flex-direction: column;
        padding: 10px 20px;
    }

    .menu-item {
        display: flex;
        align-items: center;
        gap: 18px;
        text-decoration: none;
        color: var(--text-dark);
        min-height: 56px; 
        padding: 12px 8px;
        border-radius: 8px;
        transition: background-color 0.15s ease;
    }

    .menu-item:hover, .menu-item:focus {
        background-color: #f7f7f7;
        outline: none;
    }

    .menu-item i {
        font-size: 1.4rem;
        width: 28px;
        text-align: center;
        color: #1a1a1a;
    }

    .menu-item span {
        font-size: 0.95rem;
        font-weight: 500;
    }
</style>

<header class="profile-header">
    <img src="{{ foto_perfil_url }}" alt="Foto de perfil de {{ nome_completo }}" class="avatar">
    <h1 class="user-name">{{ nome_completo }}</h1>
</header>

<main>
    <section class="address-section">
        <div class="address-card">
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
            <div class="address-info">
                <h2>ENDEREÇO DE ENTREGA</h2>
                <p>{{ endereco_entrega }}</p>
            </div>
        </div>
    </section>

    <nav class="profile-menu" aria-label="Menu do perfil">
        <a href="#notificacoes" class="menu-item">
            <i class="fa-regular fa-bell" aria-hidden="true"></i>
            <span>Notificações</span>
        </a>
        <a href="#configuracoes" class="menu-item">
            <i class="fa-solid fa-gear" aria-hidden="true"></i>
            <span>Configurações</span>
        </a>
        <a href="#dados-pessoais" class="menu-item">
            <i class="fa-regular fa-id-card" aria-hidden="true"></i>
            <span>Dados pessoais</span>
        </a>
        <a href="#pagamentos" class="menu-item">
            <i class="fa-regular fa-credit-card" aria-hidden="true"></i>
            <span>Pagamentos</span>
        </a>
        <a href="#suporte" class="menu-item">
            <i class="fa-solid fa-headset" aria-hidden="true"></i>
            <span>Suporte</span>
        </a>
    </nav>
</main>
{% endblock %}
