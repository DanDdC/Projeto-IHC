{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    :root {
        --primary-green: #81c784; 
        --light-lime: #d4f597;    
        --text-dark: #1a1a1a;
        --text-muted: #555555;
        --bg-white: #ffffff;
        --bg-item-hover: #f7f7f7;
    }

    /* Quando o body tiver a classe .dark-mode, as variáveis mudam de valor! */
    body.dark-mode {
        --text-dark: #f5f5f5;
        --text-muted: #b0b0b0;
        --bg-white: #1e1e1e;
        --bg-item-hover: #2a2a2a;
        
        /* O tom de verde escuro idêntico ao da tela de loading */
        --primary-green: #0a2e1f; 
    }

    /* 1. CABEÇALHO DO USUÁRIO */
    .profile-header {
        display: flex;
        align-items: center;
        padding: 24px 20px;
        gap: 16px;
    }

    .avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
    }

    .user-name {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text-dark);
    }

    /* 2. CARD DE ENDEREÇO */
    .address-section {
        padding: 0 20px 20px 20px;
    }

    .address-card {
        background-color: var(--primary-green);
        border-radius: 16px;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        color: #000000;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    /* Ajuste suave no card de endereço durante o modo escuro */
    body.dark-mode .address-card {
        background-color: var(--primary-green);
        color: #ffffff;
    }

    /* Configuração do ícone PNG do endereço */
    .address-card .menu-icon {
        width: 32px;
        height: 32px;
        object-fit: contain;
    }

    .address-info h2 {
        font-size: 0.9rem;
        font-weight: 700;
        margin-bottom: 2px;
        letter-spacing: 0.5px;
    }

    .address-info p {
        font-size: 0.72rem;
        font-weight: 500;
        line-height: 1.4;
    }

    /* 3. MENU DE OPÇÕES */
    .profile-menu {
        display: flex;
        flex-direction: column;
        padding: 10px 20px;
    }

    .menu-item, .toggle-item {
        display: flex;
        align-items: center;
        gap: 18px;
        text-decoration: none;
        color: var(--text-dark);
        min-height: 56px; 
        padding: 12px 8px;
        border-radius: 8px;
        transition: background-color 0.15s ease;
    }

    .menu-item:hover, .menu-item:focus, .toggle-item:hover {
        background-color: var(--bg-item-hover);
        outline: none;
    }

    /* REGRA DAS IMAGENS PNG: Controla o tamanho dos seus novos ícones */
    .menu-item .menu-icon, .toggle-item .menu-icon {
        width: 24px;
        height: 24px;
        object-fit: contain;
        display: block;
    }

    .menu-item span, .toggle-item span {
        font-size: 0.95rem;
        font-weight: 500;
    }

    /* ESTILOS DO INTERRUPTOR (SWITCH) */
    .switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
        margin-left: auto; /* Empurra o switch para a extrema direita */
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #ccc;
        transition: .3s;
        border-radius: 24px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: .3s;
        border-radius: 50%;
    }

    body.dark-mode input:checked + .slider {
        background-color: #0a2e1f; /* Verde escuro do loading para o switch ativo */
    }

    input:checked + .slider:before {
        transform: translateX(20px);
    }
</style>

<header class="profile-header">
    <img src="{{ foto_perfil_url }}" alt="Foto de perfil de {{ nome_completo }}" class="avatar">
    <h1 class="user-name">{{ nome_completo }}</h1>
</header>

<main>
    <section class="address-section">
        <div class="address-card">
            <img src="{% static 'IMG/menu.png' %}" alt="Localização" class="menu-icon">
            <div class="address-info">
                <h2>ENDEREÇO DE ENTREGA</h2>
                <p>{{ endereco_entrega }}</p>
            </div>
        </div>
    </section>

    <nav class="profile-menu" aria-label="Menu do perfil">
        <a href="#notificacoes" class="menu-item">
            <img src="{% static 'IMG/notificacoes.png' %}" alt="Notificações" class="menu-icon">
            <span>Notificações</span>
        </a>
        
        <a href="#configuracoes" class="menu-item">
            <img src="{% static 'IMG/config.png' %}" alt="Configurações" class="menu-icon">
            <span>Configurações</span>
        </a>

        <div class="toggle-item">
            <img src="{% static 'IMG/modescuro.png' %}" alt="Modo Escuro" class="menu-icon">
            <span>Modo Escuro</span>
            <label class="switch">
                <input type="checkbox" id="dark-mode-toggle" {% if request.session.dark_mode %}checked{% endif %}>
                <span class="slider"></span>
            </label>
        </div>

        <a href="#dados-pessoais" class="menu-item">
            <img src="{% static 'IMG/cartaodecrebito.png' %}" alt="Dados pessoais" class="menu-icon">
            <span>Dados pessoais</span>
        </a>
        
        <a href="#pagamentos" class="menu-item">
            <img src="{% static 'IMG/pagamentos.png' %}" alt="Pagamentos" class="menu-icon">
            <span>Pagamentos</span>
        </a>
        
        <a href="#suporte" class="menu-item">
            <img src="{% static 'IMG/sup.png' %}" alt="Suporte" class="menu-icon">
            <span>Suporte</span>
        </a>
    </nav>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggle = document.getElementById('dark-mode-toggle');
        
        if (toggle) {
            toggle.addEventListener('change', () => {
                // 1. Envia sinal ao Django para salvar o estado na Session do backend
                fetch("{% url 'alternar_modo_escuro' %}")
                    .then(response => response.json())
                    .then(data => {
                        // 2. Transiciona as cores na mesma hora na janela do usuário
                        if (data.dark_mode) {
                            document.body.classList.add('dark-mode');
                        } else {
                            document.body.classList.remove('dark-mode');
                        }
                    })
                    .catch(error => {
                        console.error('Erro ao alternar o modo escuro:', error);
                    });
            });
        }
    });
</script>
{% endblock %}
